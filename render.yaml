services:
  - type: web
    name: tfuture
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn TFuture.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DB_NAME
        fromService:
          type: postgres
          name: tfuture-db
          property: database
      - key: DB_USER
        fromService:
          type: postgres
          name: tfuture-db
          property: user
      - key: DB_PASSWORD
        fromService:
          type: postgres
          name: tfuture-db
          property: password
      - key: DB_HOST
        fromService:
          type: postgres
          name: tfuture-db
          property: host
      - key: DB_PORT
        fromService:
          type: postgres
          name: tfuture-db
          property: port
    staticPublishPath: ./staticfiles

  - type: postgres
    name: tfuture-db
    plan: free
    ipAllowList: [] 