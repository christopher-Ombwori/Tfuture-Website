{% load wagtailimages_tags %}

<div class="my-8">
  <div class="relative w-full overflow-hidden rounded-xl border border-white/10 shadow">
    {% image value.before width-1920 as before_img %}
    {% image value.after width-1920 as after_img %}
    <div class="relative aspect-video" style="--pos: {{ value.start_position|default:50 }}%">
      <div class="absolute inset-0">
        <img src="{{ before_img.url }}" alt="Before" class="w-full h-full object-cover absolute inset-0 select-none" draggable="false">
        <div class="absolute inset-0" style="clip-path: inset(0 calc(100% - var(--pos)) 0 0)">
          <img src="{{ after_img.url }}" alt="After" class="w-full h-full object-cover absolute inset-0 select-none" draggable="false">
        </div>
      </div>
      <div class="absolute inset-y-0 z-10" style="left: var(--pos)">
        <div class="w-0.5 h-full bg-accent/80"></div>
        <button class="absolute top-1/2 -translate-y-1/2 -left-3 w-6 h-6 rounded-full bg-accent shadow ring-2 ring-accent/40 cursor-ew-resize hover:bg-accent/90 transition-colors" type="button" aria-label="Drag slider"></button>
      </div>
    </div>
  </div>
  {% if value.caption %}
    <div class="text-sm text-center text-gray-400 mt-2">{{ value.caption }}</div>
  {% endif %}
</div>
