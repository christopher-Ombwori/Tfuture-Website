<div class="my-8">
  <div class="relative w-full overflow-hidden rounded-xl border border-white/10 shadow">
    {% image value.before width-1920 as before_img %}
    {% image value.after width-1920 as after_img %}
    <div class="relative" style="--pos: {{ value.start_position|default:50 }}%">
      <img src="{{ before_img.url }}" alt="Before" class="block w-full select-none" draggable="false">
      <div class="absolute inset-0" style="clip-path: inset(0 calc(100% - var(--pos)) 0 0)">
        <img src="{{ after_img.url }}" alt="After" class="block w-full select-none" draggable="false">
      </div>
      <div class="absolute inset-y-0" style="left: var(--pos)">
        <div class="w-0.5 h-full bg-accent/80"></div>
        <button class="absolute top-1/2 -translate-y-1/2 -left-3 w-6 h-6 rounded-full bg-accent shadow ring-2 ring-accent/40 cursor-ew-resize" type="button" aria-label="Drag slider"></button>
      </div>
    </div>
  </div>
  {% if value.caption %}
    <div class="text-sm text-center text-gray-400 mt-2">{{ value.caption }}</div>
  {% endif %}
</div>

<script>
  (function(){
    const containers = document.querySelectorAll('[style*="--pos:"]');
    containers.forEach(container => {
      const handle = container.querySelector('button[aria-label="Drag slider"]');
      const line = handle?.parentElement;
      let dragging = false;
      function setPos(clientX){
        const rect = container.getBoundingClientRect();
        let p = ((clientX - rect.left) / rect.width) * 100;
        p = Math.max(0, Math.min(100, p));
        container.style.setProperty('--pos', p + '%');
      }
      function onMove(e){ if(!dragging) return; setPos(e.touches? e.touches[0].clientX : e.clientX); }
      function onDown(e){ dragging = true; setPos(e.touches? e.touches[0].clientX : e.clientX); }
      function onUp(){ dragging = false; }
      handle?.addEventListener('mousedown', onDown);
      handle?.addEventListener('touchstart', onDown, {passive:true});
      window.addEventListener('mousemove', onMove, {passive:true});
      window.addEventListener('touchmove', onMove, {passive:true});
      window.addEventListener('mouseup', onUp);
      window.addEventListener('touchend', onUp);
    });
  })();
</script>
