<div class="my-10">
  <div class="p-6 sm:p-8 rounded-xl border shadow 
    {% if value.style == 'accent' %}bg-accent/10 border-accent/30 shadow-accent/10{% endif %}
    {% if value.style == 'info' %}bg-blue-500/10 border-blue-400/30 shadow-blue-400/10{% endif %}
    {% if value.style == 'success' %}bg-green-500/10 border-green-400/30 shadow-green-400/10{% endif %}
    {% if value.style == 'warning' %}bg-orange-500/10 border-orange-400/30 shadow-orange-400/10{% endif %}
  ">
    <div class="text-xl sm:text-2xl font-bold text-white">{{ value.title }}</div>
    {% if value.body %}
    <div class="prose prose-invert max-w-none mt-2">{{ value.body|richtext }}</div>
    {% endif %}
    <div class="mt-4">
      {% if value.button_url %}
        <a href="{{ value.button_url }}" class="inline-flex items-center px-5 py-2.5 rounded-lg bg-primary text-accent font-medium hover:bg-primary/90 transition-all border border-accent/30">{{ value.button_label }}</a>
      {% else %}
        <button onclick="openServiceModal('{{ general_inquiry.id }}', '{{ general_inquiry.name }}')" class="inline-flex items-center px-5 py-2.5 rounded-lg bg-primary text-accent font-medium hover:bg-primary/90 transition-all border border-accent/30">{{ value.button_label }}</button>
      {% endif %}
    </div>
  </div>
</div>
