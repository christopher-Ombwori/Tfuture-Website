{% load wagtailimages_tags %}
<figure class="my-8" style="border-radius:0!important;">
  {% image value.image width-1920 class="w-full h-auto" loading="lazy" alt=value.caption|default:value.image.title %}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var figs = document.querySelectorAll('figure');
      figs.forEach(function(fig) {
        fig.style.borderRadius = '0';
        var imgs = fig.querySelectorAll('img');
        imgs.forEach(function(img) {
          img.style.borderRadius = '0';
        });
      });
    });
  </script>
  {% if value.caption %}
    <figcaption class="text-sm text-gray-400 mt-2 opacity-80 italic">{{ value.caption }}</figcaption>
  {% endif %}
</figure>
